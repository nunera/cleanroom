[package]
name = "cleanroom-eval"
description = "Eval harness: runs the Cleanroom agent team against attack variants and scores every defense layer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Run inside the dev shell (bubblewrap, skopeo, umoci, nix), after building cleanroomd,
# cleanroom-agents and the static cleanroom-ransom. See docs/eval.md.

[[bin]]
name = "cleanroom-eval"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cleanroom-proto.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
humantime = "2.4.0"
regex = "1.13.1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
