[package]
name = "cleanroom-daemon"
description = "cleanroomd: the Cleanroom OS core (admission, strata, grants, receipts, bus, scenarios)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cleanroomd"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cleanroom-proto.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
humantime = "2.4.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"
