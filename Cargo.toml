[workspace]
members = ["crates/proto", "crates/agents", "crates/tui", "crates/ransom", "crates/daemon"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/nunera/cleanroom"

[workspace.dependencies]
cleanroom-proto = { path = "crates/proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2.2"
getrandom = { version = "0.3", features = ["std"] }
