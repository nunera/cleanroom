[workspace]
members = ["crates/proto"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/nunera/cleanroom"

[workspace.dependencies]
cleanroom-proto = { path = "crates/proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
